name: Autonomous Water Softener Grain & RO Sizing Engine

on:
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_softener:
        description: 'Optional Softener Model or Scenario (e.g. Fleck 5600SXT 48000 Grain)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-softener-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Softener Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_SOFTENER: ${{ github.event.inputs.custom_softener || '' }}
        run: |
          python engine/softener_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_softeners.json
          if git diff --staged --quiet; then
            echo "No new water softener pages to commit."
          else
            git commit -m "chore(water): auto-publish new water softener grain & salt calculators"
            git push origin main
          fi
